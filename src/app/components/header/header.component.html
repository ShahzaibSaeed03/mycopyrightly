<div class="header flex justify-content-between align-items-center">
    <h2 [ngClass]="titles.includes(pageTitle) ? 'highlight': 'default'">
        {{pageTitle}}
    </h2>
    <h3 *ngIf="_authService.user$ | async as user">{{user.remainingTokens}} Remaining Tokens - Next subscription billing
        on {{user.dateEndSubscription | date:'dd/MM/yyyy'}}</h3>
</div>
